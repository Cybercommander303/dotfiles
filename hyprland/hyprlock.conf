# ╔══════════════════════════════════════════════╗
# ║                  HYPRLOCK                    ║
# ║              1280 × 1024                    ║
# ╚══════════════════════════════════════════════╝


general {
    hide_cursor = true
    ignore_empty_input = false
}


# ───────────────────────────────────────────────
# BACKGROUND
# ───────────────────────────────────────────────

background {
    monitor =
    path = ~/Pictures/Wallpapers/purple-cattppucin.jpg
    # NO BLUR
    blur_passes = 0

    brightness = 1.0
    contrast = 1.0
    vibrancy = 0.0
}


# ───────────────────────────────────────────────
# DATE
# ───────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] date +"%A, %B %d"

    font_family = Montserrat
    font_size = 18

    color = rgba(255, 255, 255, 0.95)

    halign = center
    valign = center

    position = 0, 420
}


# ───────────────────────────────────────────────
# TIME
# ───────────────────────────────────────────────

label {
    monitor =

    text = cmd[update:1000] date +"%H:%M"

    font_family = Montserrat
    font_size = 100

    color = rgba(255, 255, 255, 0.98)

    halign = center
    valign = center

    position = 0, 330
}

# ───────────────────────────────────────────────
# PASSWORD INPUT
# ───────────────────────────────────────────────

input-field {
    monitor =

    size = 260, 50

    halign = center
    valign = center

    # BELOW THE PFP
    position = 0, -400

    outline_thickness = 0

    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)

    font_family = Montserrat
    font_color = rgba(255, 255, 255, 0.95)

    dots_size = 0.22
    dots_spacing = 0.18
    dots_center = true
    dots_rounding = -1

    fade_on_empty = false

    rounding = -1

    check_color = rgba(255, 255, 255, 0.95)
    fail_color = rgba(255, 80, 80, 0.95)

    fail_text =
}
