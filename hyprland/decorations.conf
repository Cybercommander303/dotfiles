# DECORATIONS

general {
    gaps_in = 7
    gaps_out = 17
    border_size = 1
}

decoration {
    rounding = 3
    active_opacity = 0.92
    inactive_opacity = 0.82

    shadow {
        enabled = true
        range = 12
        render_power = 5
    }

    blur {
      enabled = true
      size = 7
      passes = 3
    }
}

animations {
  enabled = true

  bezier = smooth, 0.05, 0.9, 0.1, 1
  bezier = overclock, 0.55, 0, 0.1, 1
  bezier = bounce, 0.24, 1.02, 0.08, 1.41
  bezier = windowSmooth, 0.22, 1, 0.36, 1

  animation = windows, 1, 6, windowSmooth
  animation = windowsOut, 1, 5, windowSmooth
  animation = fade, 1, 5, smooth
  animation = workspaces, 1, 4, windowSmooth
}
