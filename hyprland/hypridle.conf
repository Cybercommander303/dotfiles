general {
    lock_cmd = pidof hyprlock || hyprlock        # what "loginctl lock-session" runs
    before_sleep_cmd = loginctl lock-session     # lock before suspending
    after_sleep_cmd = hyprctl dispatch dpms on   # wake screens after suspend
    ignore_dbus_inhibit = false                  # let video players / calls keep the screen awake
    ignore_systemd_inhibit = false
}

# lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# turn the screens off after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend after 15 minutes
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
