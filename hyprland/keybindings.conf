# KEYBINDINGS
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, BACKSPACE, killactive
bind = SUPER, X, exit
bind = SUPER, L, exec, hyprlock
bind = SUPER, SPACE, exec, qs -c launcher ipc call launcher toggle
bind = SUPER, W, exec, qs -c wallpaper ipc call wallpaper toggle
bind = SUPER, D, exec, qs -c dock ipc call dock toggle
bind = SUPER, S, exec, qs -c settings ipc call settings toggle
bind = , Print, exec, qs -c screenshot ipc call capture start
bind = SUPER SHIFT, S, exec, qs -c screenshot ipc call capture start
bind = SUPER, O, exec, qs -c overview ipc call overview toggle
#MOVE_FOCUS
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

#MOVE_WINDOW
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

#FLOATING WINDOWS
bind = SUPER, V, togglefloating
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# RELOAD CONFIG
bind = SUPER SHIFT, R, exec, hyprctl reload

